name: Build and Publish Wheels

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Stand 2026: ubuntu-24.04 ist stabil für cibuildwheel 3.x
        os: [ubuntu-24.04, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.4.0

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          # --- Mac-Spezifisch: OpenMP Support ---
          CIBW_BEFORE_BUILD_MACOS: brew install libomp
          CIBW_ENVIRONMENT_MACOS: >
            LDFLAGS="-L$(brew --prefix libomp)/lib" 
            CPPFLAGS="-I$(brew --prefix libomp)/include"
          
          # --- Build-Strategie & Stabilität ---
          CIBW_BUILD_FRONTEND: "build"
          CIBW_RETRY_DELAY: 15         # Mehr Puffer für Netzwerk-Limits (429 Error)
          CIBW_RETRY_COUNT: 3
          
          # --- Versionen einschränken (Anpassbar) ---
          # Wir überspringen alte Versionen und PyPy für C++ Extensions
          CIBW_SKIP: cp36-* cp37-* cp38-* cp39-* pp*
          
          # Zeige Compiler-Output für einfacheres Debugging
          CIBW_BUILD_VERBOSITY: 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  make_sdist:
    name: Create source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, make_sdist]
    runs-on: ubuntu-latest
    # Nur hochladen, wenn ein Tag v* gepusht wurde
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # Erforderlich für OIDC / Trusted Publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1.12
