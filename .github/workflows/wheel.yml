name: Build and Publish Wheels

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45  # Gib den Buildern genug Zeit
    strategy:
      fail-fast: false   # WICHTIG: Wenn Windows hängt, soll Linux trotzdem fertig bauen!
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.4.0

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/cibuildwheel
          key: ${{ runner.os }}-cibw-${{ hashFiles('pyproject.toml') }}
          
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
          
          # --- Bestehende Mac-Konfiguration ---
          CIBW_BEFORE_BUILD_MACOS: brew install libomp
          CIBW_ENVIRONMENT_MACOS: >
            LDFLAGS="-L$(brew --prefix libomp)/lib" 
            CPPFLAGS="-I$(brew --prefix libomp)/include"
            MACOSX_DEPLOYMENT_TARGET=15.0
          
          CIBW_BUILD_FRONTEND: "build"
          
          # NUR NOCH DAS HIER SKIPEPN (Version 3.x Standard)
          CIBW_SKIP: cp38-* cp39-*
          
          CIBW_RETRY_DELAY: 20
          CIBW_RETRY_COUNT: 3
          CIBW_BUILD_VERBOSITY: 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  make_sdist:
    name: Create source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
      needs: [build_wheels, make_sdist]
      runs-on: ubuntu-latest

      if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
      permissions:
        id-token: write
      steps:
        - name: Download all artifacts
          uses: actions/download-artifact@v4
          with:
            pattern: cibw-*
            path: dist
            merge-multiple: true
  
        - name: Publish to PyPI
          uses: pypa/gh-action-pypi-publish@release/v1.13
